memory_limit=512M
upload_max_filesize=32M
post_max_size=32M
max_execution_time=300
max_input_time=300
max_input_vars=10000
date.timezone=UTC
expose_php=Off
display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL
opcache.enable=1
opcache.validate_timestamps=0
session.cookie_httponly=1
session.cookie_samesite=Lax
