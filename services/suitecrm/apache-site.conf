<VirtualHost *:8080>
    ServerName suitecrm.railway.internal
    DocumentRoot /var/lib/suitecrm/app/public

    # Container liveness is not application readiness. This exact static path
    # is outside the app/htaccess tree and cannot invoke SuiteCRM or PHP.
    AliasMatch "^/_clawpilot/liveness$" "/opt/clawpilot/native-email-liveness.json"
    <Directory /opt/clawpilot>
        Require all denied
    </Directory>
    <LocationMatch "^/_clawpilot/liveness$">
        Require method GET HEAD
        SetHandler default-handler
        ForceType application/json
        Header always set Cache-Control "no-store"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>

    <Directory /var/lib/suitecrm/app/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    RemoteIPHeader X-Forwarded-For
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
