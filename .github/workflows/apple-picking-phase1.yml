name: Apple Picking Phase 1

on:
  pull_request:
    branches: [dev]
    paths:
      - 'clients/apple/**'
      - 'scripts/test-apple-environment-split.mjs'
      - 'scripts/test-apple-native-ci.mjs'
      - '.github/workflows/apple-picking-phase1.yml'
  push:
    # The direct dev push is the native release gate. Promotion to main carries
    # that reviewed tree and remains covered by the normal Linux CI workflow,
    # so do not pay for the same macOS simulator build twice.
    branches: [dev]
    paths:
      - 'clients/apple/**'
      - 'scripts/test-apple-environment-split.mjs'
      - 'scripts/test-apple-native-ci.mjs'
      - '.github/workflows/apple-picking-phase1.yml'

concurrency:
  group: apple-picking-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODEGEN_VERSION: '2.45.4'
      XCODEGEN_SHA256: '090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "${RUNNER_TEMP}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  ${RUNNER_TEMP}/xcodegen.zip" | shasum --algorithm 256 --check
          ditto -x -k "${RUNNER_TEMP}/xcodegen.zip" "${RUNNER_TEMP}/xcodegen"
          sudo "${RUNNER_TEMP}/xcodegen/xcodegen/install.sh"
          test "$(xcodegen --version)" = "Version: ${XCODEGEN_VERSION}"
      # Server-side wearable contracts are already part of the Linux CI test
      # graph. Keep this paid macOS runner focused on native-only validation.
      - name: Validate native Apple contracts and fixtures
        run: |
          node scripts/test-apple-native-ci.mjs
          node scripts/test-apple-environment-split.mjs
          swift test \
            --package-path clients/apple \
            --scratch-path /tmp/clawpilot-wearable-phase1-swift \
            --jobs 1
          swift clients/apple/Tools/verify-meta-mock-fixtures.swift \
            clients/apple/Apps/iPhone/TestResources
      - name: Build iPhone and Watch simulators
        run: clients/apple/run-xcode-simulator-builds.sh
