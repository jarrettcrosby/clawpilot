name: CI

on:
  push:
    branches:
      - main
      - dev
  # Direct dev/main pushes are authoritative. PR validation is reserved for
  # feature branches targeting dev so the standing dev -> main promotion PR
  # does not run the same commit twice.
  pull_request:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suitecrm-email-search:
    # Playwright 1.58.2 supports 24.04, not the rolling 26.04 runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: SuiteCRM Email search PHP and Smarty behavioral tests
        run: npm run test:suitecrm-email-search

  validate:
    runs-on: ubuntu-24.04
    # Hosted-runner progress projects about 32 minutes per PostgreSQL catalog
    # matrix, in addition to the application/browser and downstream gates.
    # Keep both complete matrices within an explicit, finite job deadline.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch rolling-release compatibility sources
        # Keep both actual historical readers available in the shallow checkout.
        # Fail here, before expensive gates, if either pinned source is absent.
        run: |
          git fetch --no-tags --depth=1 origin \
            9d67c8d097bcd475e0109c3169a61a0885fcf059 \
            b61192200b6d990adb320fd7f941a619976bc4af
          git cat-file -e 9d67c8d097bcd475e0109c3169a61a0885fcf059:app_src/lib/persistence/shopifyOrderManagement.ts
          git cat-file -e b61192200b6d990adb320fd7f941a619976bc4af:app_src/lib/persistence/crm.ts

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app_src/package-lock.json
            shopify/package-lock.json

      - name: Preload pinned offline PHP contract runtime
        # Contract fixtures deliberately use --pull=never and --network=none.
        # Provision their unchanged runtime before the isolated tests begin.
        run: |
          docker pull php:8.3.35-cli-alpine
          docker image inspect php:8.3.35-cli-alpine --format '{{json .RepoDigests}}'

      - name: Install pinned Caddy contract dependency
        env:
          CADDY_VERSION: 2.11.4
          CADDY_LINUX_AMD64_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            --output /tmp/caddy.tar.gz
          echo "${CADDY_LINUX_AMD64_SHA512}  /tmp/caddy.tar.gz" | sha512sum --check --strict
          sudo tar --extract --gzip --file /tmp/caddy.tar.gz --directory /usr/local/bin caddy
          caddy version

      - name: Install
        run: |
          npm --prefix app_src ci
          npm --prefix shopify ci

      - name: Install Playwright Chromium
        run: npm --prefix app_src exec -- playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Fractional scoped gateway PostgreSQL and HTTP acceptance
        env:
          CLAWPILOT_TEST_POSTGRES_MEMORY: 512m
          CLAWPILOT_TEST_POSTGRES_TMPFS_SIZE: 256m
          CLAWPILOT_TEST_POSTGRES_CPUS: '1'
        run: |
          docker pull pgvector/pgvector:pg16
          docker image inspect pgvector/pgvector:pg16 --format '{{json .RepoDigests}}'
          npm run test:fractional-crm-gateway

      - name: Tests
        run: npm run test

      - name: Managed workbook bootstrap PostgreSQL acceptance
        run: npm run test:pipeline-workbook-postgres

      - name: Shopify test-store canonical E2E contract
        run: npm run test:shopify-test-store-canonical-e2e

      - name: Shopify checkout unit cartonization PostgreSQL acceptance
        run: node scripts/test-shopify-checkout-unit-material-postgres.mjs

      - name: Store sync PostgreSQL acceptance
        run: npm run test:commerce-store-sync

      - name: Shipping independence PostgreSQL acceptance
        run: npm run test:shipping-independence-postgres

      - name: Shopify order webhook reconciliation acceptance
        run: npm run test:shopify-order-webhook-reconciliation

      - name: Predeploy verification
        run: npm run verify:predeploy
