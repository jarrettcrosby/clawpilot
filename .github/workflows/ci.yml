name: CI

on:
  push:
    branches:
      - main
      - dev
  # Direct dev/main pushes are authoritative. PR validation is reserved for
  # feature branches targeting dev so the standing dev -> main promotion PR
  # does not run the same commit twice.
  pull_request:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suitecrm-email-search:
    # Playwright 1.58.2 supports 24.04, not the rolling 26.04 runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: SuiteCRM Email search PHP and Smarty behavioral tests
        run: npm run test:suitecrm-email-search
      - name: Preload PHP for SuiteCRM router tests
        run: docker pull php:8.2-cli-alpine
      - name: SuiteCRM installer and legacy router upgrade tests
        run: npm run test:suitecrm-email-audience-php

  validate-postgres-catalog:
    name: PostgreSQL ${{ matrix.postgres }} catalog attestation
    runs-on: ubuntu-24.04
    # Each runner executes the entire catalog and final lock check for its
    # PostgreSQL major. Running both serially exceeded the app job deadline.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          # Catalog fingerprints depend on the database build, not just its
          # major. Update these only with a reviewed catalog comparison.
          - postgres: '16'
            digest: sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
          - postgres: '18'
            digest: sha256:c29f30688a9ad961691bdf0ec1650717cc132a5814619d80f80463d6e4c42e47
    env:
      CLAWPILOT_TEST_POSTGRES_IMAGE: pgvector/pgvector:pg${{ matrix.postgres }}
      CATALOG_POSTGRES_DIGEST: ${{ matrix.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app_src/package-lock.json
      - name: Install application test dependencies
        run: npm --prefix app_src ci
      - name: Preload the audited PostgreSQL build
        run: |
          set -euo pipefail
          pinned="pgvector/pgvector@$CATALOG_POSTGRES_DIGEST"
          docker pull "$pinned"
          docker image inspect "$pinned" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -Fx "$pinned"
          # The fixtures use a major-bearing image name and --pull=never.
          docker tag "$pinned" "$CLAWPILOT_TEST_POSTGRES_IMAGE"
          test "$(docker image inspect "$pinned" --format '{{.Id}}')" = "$(docker image inspect "$CLAWPILOT_TEST_POSTGRES_IMAGE" --format '{{.Id}}')"
      - name: CRM maintenance transaction and writer isolation
        env:
          CLAWPILOT_TEST_POSTGRES_MEMORY: 512m
          CLAWPILOT_TEST_POSTGRES_TMPFS_SIZE: 256m
          CLAWPILOT_TEST_POSTGRES_CPUS: '1'
          CRM_FIXTURE_POSTGRES: ${{ matrix.postgres }}
        run: node scripts/test-crm-maintenance-write-fence-postgres.mjs "--postgres-major=$CRM_FIXTURE_POSTGRES"
      - name: Full production rebind history and schema attestation
        run: node scripts/test-production-rebind-history-schema-attestation.mjs

  validate-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch rolling-release compatibility sources
        # Keep both actual historical readers available in the shallow checkout.
        # Fail here, before expensive gates, if either pinned source is absent.
        run: |
          git fetch --no-tags --depth=1 origin \
            9d67c8d097bcd475e0109c3169a61a0885fcf059 \
            b61192200b6d990adb320fd7f941a619976bc4af
          git cat-file -e 9d67c8d097bcd475e0109c3169a61a0885fcf059:app_src/lib/persistence/shopifyOrderManagement.ts
          git cat-file -e b61192200b6d990adb320fd7f941a619976bc4af:app_src/lib/persistence/crm.ts

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app_src/package-lock.json
            shopify/package-lock.json

      - name: Preload pinned offline PHP contract runtime
        # Contract fixtures deliberately use --pull=never and --network=none.
        # Provision their unchanged runtime before the isolated tests begin.
        run: |
          docker pull php:8.3.35-cli-alpine
          docker image inspect php:8.3.35-cli-alpine --format '{{json .RepoDigests}}'

      - name: Install pinned Caddy contract dependency
        env:
          CADDY_VERSION: 2.11.4
          CADDY_LINUX_AMD64_SHA512: 8220d1f013b6f27510247b2360c9e0ca9f018feebd82515f07635318b34ff9777ccc8fd0b6e6f2486ce3a33fe389fbb7db12d05baa474f4587509fb4f5ebf1c9
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz" \
            --output /tmp/caddy.tar.gz
          echo "${CADDY_LINUX_AMD64_SHA512}  /tmp/caddy.tar.gz" | sha512sum --check --strict
          sudo tar --extract --gzip --file /tmp/caddy.tar.gz --directory /usr/local/bin caddy
          caddy version

      - name: Install
        run: |
          npm --prefix app_src ci
          npm --prefix shopify ci

      - name: Install Playwright Chromium
        run: npm --prefix app_src exec -- playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: CRM maintenance ingress and unrelated pipeline queue isolation
        run: node --test scripts/test-crm-sync-maintenance.mjs scripts/test-pipeline-native-publication-intent.mjs scripts/test-pipeline-workbook-bootstrap-safety.mjs

      - name: Build
        run: npm run build

      - name: Fractional scoped gateway PostgreSQL and HTTP acceptance
        env:
          CLAWPILOT_TEST_POSTGRES_MEMORY: 512m
          CLAWPILOT_TEST_POSTGRES_TMPFS_SIZE: 256m
          CLAWPILOT_TEST_POSTGRES_CPUS: '1'
        run: |
          docker pull pgvector/pgvector:pg16
          docker image inspect pgvector/pgvector:pg16 --format '{{json .RepoDigests}}'
          npm run test:fractional-crm-gateway

      - name: Verify the hosted test partition
        run: node --test scripts/test-ci-app-test-plan.mjs

      - name: Application tests (full catalogs run in the PostgreSQL matrix)
        run: node scripts/run-ci-app-tests.mjs

      - name: Managed workbook bootstrap PostgreSQL acceptance
        run: npm run test:pipeline-workbook-postgres

      - name: Shopify test-store canonical E2E contract
        run: npm run test:shopify-test-store-canonical-e2e

      - name: Shopify checkout unit cartonization PostgreSQL acceptance
        run: node scripts/test-shopify-checkout-unit-material-postgres.mjs

      - name: Store sync PostgreSQL acceptance
        run: npm run test:commerce-store-sync

      - name: Shipping independence PostgreSQL acceptance
        run: npm run test:shipping-independence-postgres

      - name: Shopify order webhook reconciliation acceptance
        run: npm run test:shopify-order-webhook-reconciliation

      - name: Predeploy verification
        run: npm run verify:predeploy

  validate:
    # Preserve the existing check name and never turn a skipped, failed or
    # cancelled predecessor into a successful release gate.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [suitecrm-email-search, validate-app, validate-postgres-catalog]
    if: ${{ always() }}
    steps:
      - name: Require every validation job to pass
        env:
          SUITECRM_CHECK_RESULT: ${{ needs.suitecrm-email-search.result }}
          APP_CHECK_RESULT: ${{ needs.validate-app.result }}
          CATALOG_CHECK_RESULT: ${{ needs.validate-postgres-catalog.result }}
        run: |
          test "$SUITECRM_CHECK_RESULT" = success
          test "$APP_CHECK_RESULT" = success
          test "$CATALOG_CHECK_RESULT" = success
