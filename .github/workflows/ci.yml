name: CI

on:
  push:
    branches:
      - main
      - dev
  # Direct dev/main pushes are authoritative. PR validation is reserved for
  # feature branches targeting dev so the standing dev -> main promotion PR
  # does not run the same commit twice.
  pull_request:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suitecrm-email-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: SuiteCRM Email search PHP and Smarty behavioral tests
        run: npm run test:suitecrm-email-search

  validate:
    runs-on: ubuntu-latest
    # Leave room for the full PostgreSQL and browser contract matrix on a slow
    # hosted runner while still bounding a genuinely wedged validation job.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch rolling-release compatibility source
        run: git fetch --no-tags --depth=1 origin 9d67c8d097bcd475e0109c3169a61a0885fcf059

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app_src/package-lock.json
            shopify/package-lock.json

      - name: Install
        run: |
          npm --prefix app_src ci
          npm --prefix shopify ci

      - name: Install Playwright Chromium
        run: npm --prefix app_src exec -- playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

      - name: Shopify test-store canonical E2E contract
        run: npm run test:shopify-test-store-canonical-e2e

      - name: Shopify checkout unit cartonization PostgreSQL acceptance
        run: node scripts/test-shopify-checkout-unit-material-postgres.mjs

      - name: Store sync PostgreSQL acceptance
        run: npm run test:commerce-store-sync

      - name: Shipping independence PostgreSQL acceptance
        run: npm run test:shipping-independence-postgres

      - name: Shopify order webhook reconciliation acceptance
        run: npm run test:shopify-order-webhook-reconciliation

      - name: Predeploy verification
        run: npm run verify:predeploy
