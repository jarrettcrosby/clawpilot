name: CI

on:
  push:
    branches:
      - main
      - dev
  # Direct dev/main pushes are authoritative. PR validation is reserved for
  # feature branches targeting dev so the standing dev -> main promotion PR
  # does not run the same commit twice.
  pull_request:
    branches:
      - dev

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app_src/package-lock.json
            shopify/package-lock.json

      - name: Install
        run: |
          npm --prefix app_src ci
          npm --prefix shopify ci

      - name: Install Playwright Chromium
        run: npm --prefix app_src exec -- playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test

      - name: Predeploy verification
        run: npm run verify:predeploy
