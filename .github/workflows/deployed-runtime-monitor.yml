name: Deployed runtime monitor

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployed-runtime-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: production and development
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify production runtime contract
        env:
          CLAWPILOT_BASE_URL: https://aiapp.eigenracing.com
          CLAWPILOT_EXPECT_BRANCH: main
          CLAWPILOT_EXPECT_ENVIRONMENT: production
        run: node scripts/monitor-deployed-runtime.mjs

      - name: Verify development runtime contract
        env:
          CLAWPILOT_BASE_URL: https://dev.aiapp.eigenracing.com
          CLAWPILOT_EXPECT_BRANCH: dev
          CLAWPILOT_EXPECT_ENVIRONMENT: development
        run: node scripts/monitor-deployed-runtime.mjs
