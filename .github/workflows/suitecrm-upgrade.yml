name: SuiteCRM packaged upgrade

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'services/suitecrm/**'
      - 'scripts/rehearse-suitecrm-8-10-2.mjs'
      - 'scripts/test-suitecrm-native-acceptance.mjs'
      - 'scripts/lib/native-runtime-fixture-profile.mjs'
      - 'scripts/fixtures/native-email-audience-real/bootstrap.sh'
      - 'scripts/fixtures/native-email-audience-real/native-shared-email*.php'
      - 'scripts/fixtures/suitecrm-8-10-2-oauth-smoke.php'
      - 'scripts/fixtures/suitecrm-no-ssh-native-launch.sh'
      - '.github/workflows/suitecrm-upgrade.yml'
  push:
    branches: [main]
    paths:
      - 'services/suitecrm/**'
      - 'scripts/rehearse-suitecrm-8-10-2.mjs'
      - 'scripts/test-suitecrm-native-acceptance.mjs'
      - 'scripts/lib/native-runtime-fixture-profile.mjs'
      - 'scripts/fixtures/native-email-audience-real/bootstrap.sh'
      - 'scripts/fixtures/native-email-audience-real/native-shared-email*.php'
      - 'scripts/fixtures/suitecrm-8-10-2-oauth-smoke.php'
      - 'scripts/fixtures/suitecrm-no-ssh-native-launch.sh'
      - '.github/workflows/suitecrm-upgrade.yml'

permissions:
  contents: read

jobs:
  suitecrm-packaged-upgrade:
    # The dev-to-main promotion gets the authoritative check on the main push.
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the exact candidate on native Linux amd64
        run: docker build --platform linux/amd64 --iidfile "$RUNNER_TEMP/suitecrm-native-launch.iid" --tag clawpilot-suitecrm:upgrade-8.10.2-local services/suitecrm
      - name: Verify maintenance PID 1 and all child exit paths on native Linux
        run: bash scripts/fixtures/suitecrm-no-ssh-native-launch.sh --iidfile "$RUNNER_TEMP/suitecrm-native-launch.iid"
      - name: Prepare public fixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker pull mariadb:11.4.13
          mkdir "$RUNNER_TEMP/suitecrm-archive"
          curl --fail --location --retry 4 --output "$RUNNER_TEMP/suitecrm-archive/SuiteCRM-8.10.1.zip" \
            https://github.com/SuiteCRM/SuiteCRM-Core/releases/download/v8.10.1/SuiteCRM-8.10.1.zip
          curl --fail --location --retry 4 --output "$RUNNER_TEMP/suitecrm-archive/SuiteCRM-8.10.2.zip" \
            https://github.com/SuiteCRM/SuiteCRM-Core/releases/download/v8.10.2/SuiteCRM-8.10.2.zip
      - name: Upgrade an isolated volume, run the private canary and cold boot
        run: >-
          node scripts/rehearse-suitecrm-8-10-2.mjs
          "$RUNNER_TEMP/suitecrm-archive/SuiteCRM-8.10.1.zip"
          "$RUNNER_TEMP/suitecrm-archive/SuiteCRM-8.10.2.zip" --cold-boot
      - name: Reuse the packaged PHP runtime for isolated Email fixtures
        # Both runners override the entrypoint and use checksum-pinned source
        # archives, not the application bundled in this PHP runtime image.
        run: >-
          docker image tag clawpilot-suitecrm:upgrade-8.10.2-local
          clawpilot-suitecrm-native-acceptance:8.10.1-php83-8.3.36
      - name: Verify stock SuiteCRM 8.10.1 shared Email publication and retry
        run: >-
          node scripts/test-suitecrm-native-acceptance.mjs
          --source-zip="$RUNNER_TEMP/suitecrm-archive/SuiteCRM-8.10.1.zip"
          --runtime-php=8.3.36 --shared-email-only
      - name: Verify upgraded SuiteCRM 8.10.2 shared Email over stock OAuth
        run: >-
          node scripts/rehearse-suitecrm-8-10-2.mjs
          "$RUNNER_TEMP/suitecrm-archive/SuiteCRM-8.10.1.zip"
          "$RUNNER_TEMP/suitecrm-archive/SuiteCRM-8.10.2.zip" --oauth-smoke
