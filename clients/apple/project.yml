name: ClawPilotPicking

options:
  minimumXcodeGenVersion: 2.45.4
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.2"

configs:
  Development: debug
  Production: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "3"
    MARKETING_VERSION: "0.1.0"
    CLAWPILOT_APPLE_DEVELOPMENT_TEAM: "CN2T77JHQQ"
    DEVELOPMENT_TEAM: $(CLAWPILOT_APPLE_DEVELOPMENT_TEAM)

packages:
  ClawPilotPickingPackage:
    path: .
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios.git
    exactVersion: 0.9.0
  SpeechSwift:
    url: https://github.com/soniqo/speech-swift.git
    exactVersion: 0.0.23
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 9.1.0

targets:
  ClawPilotPickingPhone:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    configFiles:
      Development: Config/Development.xcconfig
      Production: Config/Production.xcconfig
    sources:
      - path: Apps/iPhone
        excludes:
          - TestResources
      - path: Assets/ClawPilotAssets.xcassets
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Apps/iPhone/ClawPilotPickingPhone.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(CLAWPILOT_PHONE_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: ClawPilotPicking
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Apps/iPhone/Info.plist
      properties:
        CFBundleDisplayName: $(CLAWPILOT_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        ClawPilotEnvironment: $(CLAWPILOT_ENVIRONMENT)
        ClawPilotServerOrigin: $(CLAWPILOT_SERVER_ORIGIN)
        GIDClientID: $(CLAWPILOT_GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(CLAWPILOT_GOOGLE_SERVER_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - $(CLAWPILOT_META_URL_SCHEME)
          - CFBundleTypeRole: Editor
            CFBundleURLName: Google Sign-In
            CFBundleURLSchemes:
              - $(CLAWPILOT_GOOGLE_REVERSED_CLIENT_ID)
        LSApplicationQueriesSchemes:
          - fb-viewapp
        MWDAT:
          AppLinkURLScheme: $(CLAWPILOT_META_APP_LINK_SCHEME)
          MetaAppID: $(CLAWPILOT_META_APP_ID)
          ClientToken: $(CLAWPILOT_META_CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
          Analytics:
            OptOut: true
          CrashReporting:
            OptOut: true
        NSBluetoothAlwaysUsageDescription: ClawPilot connects to assigned Meta glasses for warehouse barcode capture.
        NSLocalNetworkUsageDescription: ClawPilot uses the local network for camera streaming from assigned Meta glasses.
        NSBonjourServices:
          - _bonjour._tcp
        NSCameraUsageDescription: ClawPilot scans product barcodes for assigned warehouse picks.
        NSFaceIDUsageDescription: ClawPilot uses Face ID to unlock an existing signed-in session on this iPhone.
        NSMicrophoneUsageDescription: ClawPilot listens for short pick-confirmation commands.
        NSSpeechRecognitionUsageDescription: ClawPilot converts short confirmation phrases into typed local actions.
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - external-accessory
        UISupportedExternalAccessoryProtocols:
          - com.meta.ar.wearable
    dependencies:
      - target: ClawPilotPickingWatch
      - package: ClawPilotPickingPackage
        product: ClawPilotPickingCore
      - package: ClawPilotPickingPackage
        product: ClawPilotPickingApple
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATCamera
      - package: SpeechSwift
        product: SupertonicTTS
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift

  ClawPilotPickingWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.2"
    sources:
      - path: Apps/Watch
      - path: Assets/ClawPilotAssets.xcassets
    configFiles:
      Development: Config/Development.xcconfig
      Production: Config/Production.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(CLAWPILOT_WATCH_BUNDLE_IDENTIFIER)
        PRODUCT_NAME: ClawPilotPickingWatch
        TARGETED_DEVICE_FAMILY: "4"
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: $(CLAWPILOT_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(CLAWPILOT_PHONE_BUNDLE_IDENTIFIER)
    dependencies:
      - package: ClawPilotPickingPackage
        product: ClawPilotPickingCore

schemes:
  ClawPilotPickingPhoneDev:
    build:
      targets:
        ClawPilotPickingPhone: all
    run:
      config: Development
    archive:
      config: Development
  ClawPilotPickingPhone:
    build:
      targets:
        ClawPilotPickingPhone: all
    run:
      config: Production
    archive:
      config: Production
  ClawPilotPickingWatchDev:
    build:
      targets:
        ClawPilotPickingWatch: all
    run:
      config: Development
    archive:
      config: Development
  ClawPilotPickingWatch:
    build:
      targets:
        ClawPilotPickingWatch: all
    run:
      config: Production
    archive:
      config: Production
