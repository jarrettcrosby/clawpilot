query CartDeliveryOptionsTransformRunInput {
  cart {
    buyerIdentity {
      isAuthenticated
      customer {
        id
        clawpilotRatePolicy: metafield(
          namespace: "$app:clawpilot-test-rate-isolation"
          key: "customer-rate-policy"
        ) {
          jsonValue
        }
      }
    }
    deliveryGroups {
      deliveryOptions {
        handle
        code
        title
        deliveryMethodType
      }
    }
  }
  deliveryCustomization {
    metafield(
      namespace: "$app:clawpilot-test-rate-isolation"
      key: "function-configuration"
    ) {
      jsonValue
    }
  }
}
